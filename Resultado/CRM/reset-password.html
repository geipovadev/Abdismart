<!DOCTYPE html>
<html lang="es-CR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Abdismart CRM — Nueva contraseña</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0B0D'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23C6FF3D'/%3E%3C/svg%3E">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --onyx:        #0A0B0D;
      --graphite:    #1C1F27;
      --lime:        #C6FF3D;
      --fog:         #A6ABB8;
      --bone:        #F4F5F7;
      --lime-dim:    rgba(198,255,61,.07);
      --lime-border: rgba(198,255,61,.18);
      --edge:        rgba(255,255,255,.07);
      --red:         #FF5A5A;
      --red-dim:     rgba(255,90,90,.08);
      color-scheme: dark;
    }

    html, body {
      height: 100%;
      background: var(--onyx);
      color: var(--bone);
      font-family: 'General Sans', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .bg-grid {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(198,255,61,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(198,255,61,.022) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none; z-index: 0;
    }
    .bg-glow {
      position: fixed; top: 0; left: 50%;
      transform: translateX(-50%);
      width: 800px; height: 500px;
      background: radial-gradient(ellipse, rgba(198,255,61,.055) 0%, transparent 68%);
      pointer-events: none; z-index: 0;
    }

    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 24px;
    }

    .logo { display: flex; align-items: center; gap: 9px; margin-bottom: 40px; text-decoration: none; }
    .logo img { display: block; height: 24px; width: auto; }
    .logo-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: var(--lime);
      background: var(--lime-dim); border: 1px solid var(--lime-border);
      padding: 2px 8px; border-radius: 100px; letter-spacing: .08em;
    }

    .card {
      width: 100%; max-width: 420px;
      background: var(--graphite);
      border: 1px solid var(--edge);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 32px 80px rgba(0,0,0,.4);
    }
    .card-title {
      font-family: 'Clash Display', sans-serif;
      font-size: 28px; font-weight: 600; letter-spacing: -.025em;
      margin-bottom: 6px;
    }
    .card-sub { font-size: 13px; color: var(--fog); margin-bottom: 32px; line-height: 1.6; }

    .form { display: flex; flex-direction: column; gap: 18px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: var(--fog);
      text-transform: uppercase; letter-spacing: .1em;
    }
    input {
      background: rgba(255,255,255,.04);
      border: 1px solid var(--edge);
      border-radius: 10px; padding: 13px 16px;
      font-family: 'General Sans', sans-serif; font-size: 15px;
      color: var(--bone); outline: none; width: 100%;
      transition: border-color .2s, background .2s;
    }
    input::placeholder { color: rgba(166,171,184,.35); }
    input:focus { border-color: var(--lime-border); background: rgba(198,255,61,.04); }

    .btn-primary {
      background: var(--lime); color: var(--onyx);
      border: none; border-radius: 10px; padding: 14px;
      font-family: 'General Sans', sans-serif; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-top: 6px; transition: opacity .2s, transform .15s;
    }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .55; cursor: default; }

    /* Medidor de robustez */
    .meter { display: flex; gap: 4px; margin-top: 2px; }
    .meter span {
      flex: 1; height: 3px; border-radius: 2px;
      background: rgba(255,255,255,.09); transition: background .25s;
    }
    .meter.n1 span:nth-child(1) { background: var(--red); }
    .meter.n2 span:nth-child(-n+2) { background: #FFB950; }
    .meter.n3 span:nth-child(-n+3) { background: #9BD64A; }
    .meter.n4 span { background: var(--lime); }
    .hint { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--fog); }

    .msg {
      border-radius: 10px; padding: 12px 14px;
      font-size: 13px; line-height: 1.55; display: none;
    }
    .msg.show { display: block; }
    .msg.error   { background: var(--red-dim); border: 1px solid rgba(255,90,90,.3); color: #FFC9C9; }
    .msg.success { background: var(--lime-dim); border: 1px solid var(--lime-border); color: var(--lime); }

    .foot { margin-top: 26px; text-align: center; font-size: 13px; color: var(--fog); }
    .foot a { color: var(--lime); text-decoration: none; }
    .foot a:hover { text-decoration: underline; }

    @media (max-width: 480px) { .card { padding: 32px 24px; } }
  </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="page">
  <a href="login.html" class="logo">
    <img src="assets/logo-abdismart-dark.png" alt="Abdismart" width="421" height="90">
    <span class="logo-badge">CRM</span>
  </a>

  <div class="card">
    <div class="card-title">Nueva contraseña</div>
    <p class="card-sub" id="card-sub">Elegí una contraseña nueva para tu cuenta del CRM.</p>

    <div class="msg" id="msg"></div>

    <form class="form" id="form" novalidate>
      <div class="field">
        <label for="pass1">Contraseña nueva</label>
        <input type="password" id="pass1" autocomplete="new-password" placeholder="Mínimo 10 caracteres" required>
        <div class="meter" id="meter"><span></span><span></span><span></span><span></span></div>
        <div class="hint" id="hint">Usá mayúsculas, números y algún símbolo.</div>
      </div>

      <div class="field">
        <label for="pass2">Repetir contraseña</label>
        <input type="password" id="pass2" autocomplete="new-password" placeholder="Escribila otra vez" required>
      </div>

      <button type="submit" class="btn-primary" id="btn">Guardar contraseña</button>
    </form>

    <div class="foot"><a href="login.html">← Volver al acceso</a></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var SUPABASE_URL  = 'https://zmlslhftqjljhvetmbya.supabase.co';
  var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptbHNsaGZ0cWpsamh2ZXRtYnlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MDE3NjksImV4cCI6MjA5MzA3Nzc2OX0.ZCEMvADpg-SMaZqUQFxJBnacx5552rwTAFbfg0S485M';
  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: { detectSessionInUrl: true, flowType: 'pkce' }
  });

  var $ = function (id) { return document.getElementById(id); };
  var form = $('form'), btn = $('btn'), msg = $('msg');
  var listo = false;

  function aviso(tipo, texto) {
    msg.className = 'msg show ' + tipo;
    msg.textContent = texto;
  }

  /* ── Robustez de la contraseña ──────────────────────────── */
  function fuerza(p) {
    var n = 0;
    if (p.length >= 10) n++;
    if (p.length >= 14) n++;
    if (/[A-Z]/.test(p) && /[a-z]/.test(p)) n++;
    if (/\d/.test(p) && /[^A-Za-z0-9]/.test(p)) n++;
    return Math.min(n, 4);
  }

  $('pass1').addEventListener('input', function (e) {
    var n = fuerza(e.target.value);
    $('meter').className = 'meter' + (e.target.value ? ' n' + n : '');
    $('hint').textContent = !e.target.value ? 'Usá mayúsculas, números y algún símbolo.'
      : ['Muy débil', 'Débil', 'Aceptable', 'Buena', 'Excelente'][n];
  });

  /* ── El enlace del correo trae la sesión de recuperación ── */
  db.auth.onAuthStateChange(function (evt) {
    if (evt === 'PASSWORD_RECOVERY' || evt === 'SIGNED_IN') listo = true;
  });

  db.auth.getSession().then(function (res) {
    if (res.data && res.data.session) { listo = true; return; }

    // Sin sesión: el enlace venció, ya se usó, o se entró directo a la página.
    setTimeout(function () {
      if (listo) return;
      btn.disabled = true;
      $('card-sub').textContent = 'Este enlace no es válido.';
      aviso('error', 'El enlace expiró o ya fue utilizado. Pedí uno nuevo desde la pantalla de acceso — los enlaces duran una hora.');
    }, 1200);
  });

  /* ── Guardar ────────────────────────────────────────────── */
  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    var p1 = $('pass1').value, p2 = $('pass2').value;

    if (p1.length < 10)  { aviso('error', 'La contraseña debe tener al menos 10 caracteres.'); return; }
    if (p1 !== p2)       { aviso('error', 'Las dos contraseñas no coinciden.'); return; }
    if (fuerza(p1) < 2)  { aviso('error', 'Elegí una contraseña más robusta: mezclá mayúsculas, números y símbolos.'); return; }

    btn.disabled = true;
    btn.textContent = 'Guardando…';
    msg.className = 'msg';

    var res = await db.auth.updateUser({ password: p1 });

    if (res.error) {
      btn.disabled = false;
      btn.textContent = 'Guardar contraseña';
      var m = res.error.message || '';
      aviso('error', /session|JWT|token/i.test(m)
        ? 'La sesión de recuperación venció. Pedí un enlace nuevo desde la pantalla de acceso.'
        : 'No pudimos guardar la contraseña. Intentá de nuevo.');
      return;
    }

    btn.textContent = 'Contraseña actualizada';
    aviso('success', 'Listo. Entrando al CRM…');
    setTimeout(function () { window.location.href = 'dashboard.html'; }, 1400);
  });
})();
</script>

</body>
</html>
